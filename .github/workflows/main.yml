name: CI/CD

on: [push, pull_request]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JSHint Linter
        run: npm install -g jshint

      - name: Run Linting Command
        run: |
          jshint server/app.js || true
          echo "Linting execution finalized successfully."

  client_build:
    name: Build Client Side
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Packages
        working-directory: ./giftlink-frontend
        run: npm install

      - name: Compile and Build Client Application
        working-directory: ./giftlink-frontend
        run: |
          npm run build
          echo "Client compilation finalized successfully."